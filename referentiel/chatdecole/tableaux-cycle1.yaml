      niveau: GS
    - identite: cde-lang-o031
      code: LANG-O031
      libelle: Participer à une conversation avec un adulte ou des pairs et reformuler son propos
        s’il n’a pas été compris.
      niveau: GS
    - identite: cde-lang-o032
      code: LANG-O032
      libelle: Émettre une hypothèse.
      niveau: GS
  - code: S05
    nom: Acquérir les habiletés phonologiques et le principe alphabétique
    competences:
    - identite: cde-lang-o033
      code: LANG-O033
      libelle: Identifier les sons de la langue, lors de situations d’écoute proposées par le professeur.
      niveau: PS
    - identite: cde-lang-o034
      code: LANG-O034
      libelle: Identifier un mot donné à l’oral dans une phrase, dans un texte.
      niveau: PS
    - identite: cde-lang-o035
      code: LANG-O035
      libelle: Scander les syllabes d’un mot.
      niveau: PS
    - identite: cde-lang-o036
      code: LANG-O036
      libelle: Dire des comptines courtes comprenant des phonèmes proches.
      niveau: PS
    - identite: cde-lang-o037
      code: LANG-O037
      libelle: Reconnaitre et nommer certaines lettres de son prénom écrit en capitales.
      niveau: PS
    - identite: cde-lang-o038
      code: LANG-O038
      libelle: Utiliser la voix parlée, chantée et les possibilités vocales (imitation de sons, onomatopées)
        afin d’expérimenter différents sons.
      niveau: MS
    - identite: cde-lang-o039
      code: LANG-O039
      libelle: Entendre, discriminer des phonèmes.
      niveau: MS
    - identite: cde-lang-o040
      code: LANG-O040
      libelle: Scander les syllabes d’un mot.
      niveau: MS
    - identite: cde-lang-o041
      code: LANG-O041
      libelle: Manipuler les syllabes d’un mot (ajout, suppression, permutation, répétition, fusion,
        substitution).
      niveau: MS
    - identite: cde-lang-o042
      code: LANG-O042
      libelle: Dire des comptines courtes comprenant des phonèmes proches.
      niveau: MS
    - identite: cde-lang-o043
      code: LANG-O043
      libelle: Nommer les lettres de son prénom et quelques lettres de mots connus (le professeur
        nomme systématiquement les lettres).
      niveau: MS
    - identite: cde-lang-o044
      code: LANG-O044
      libelle: Connaitre la correspondance entre les lettres scriptes majuscules et minuscules et
        les lettres cursives minuscules.
      niveau: MS
    - identite: cde-lang-o045
      code: LANG-O045
      libelle: Donner les valeurs sonores de quelques lettres de mots simples connus.
      niveau: MS
    - identite: cde-lang-o046
      code: LANG-O046
      libelle: Utiliser les possibilités sonores de la voix.
      niveau: GS
    - identite: cde-lang-o047
      code: LANG-O047
      libelle: Augmenter sa mémoire auditive et sa capacité de concentration.
      niveau: GS
    - identite: cde-lang-o048
      code: LANG-O048
      libelle: Supprimer, ajouter, remplacer, inverser, substituer, fusionner les syllabes d’un mot.
      niveau: GS
    - identite: cde-lang-o049
      code: LANG-O049
      libelle: Repérer et produire des rimes et des assonances.
      niveau: GS
    - identite: cde-lang-o050
      code: LANG-O050
      libelle: Entendre, discriminer, manipuler des phonèmes.
      niveau: GS
    - identite: cde-lang-o051
      code: LANG-O051
      libelle: Connaitre le nom des lettres de l’alphabet.
      niveau: GS
    - identite: cde-lang-o052
      code: LANG-O052
      libelle: Connaitre les différentes graphies d’une même lettre (majuscule lettre capitale ;
        minuscules scriptes ; cursives).
      niveau: GS
    - identite: cde-lang-o053
      code: LANG-O053
      libelle: Distinguer des lettres visuellement proches (b/d, c/e/o, p/q) grâce à leur écriture
        cursive et les nommer correctement.
      niveau: GS
    - identite: cde-lang-o054
      code: LANG-O054
      libelle: Connaitre le nom des lettres de l’alphabet et leur valeur sonore hormis les occlusives.
      niveau: GS
    - identite: cde-lang-o055
      code: LANG-O055
      libelle: Discriminer des mots auditivement proches.
      niveau: GS
  - code: S06
    nom: S’éveiller à la diversité linguistique
    competences:
    - identite: cde-lang-o056
      code: LANG-O056
      libelle: Écouter des chants, des comptines, des histoires connues dans des versions en français
        et en langue étrangère.
      niveau: PS
    - identite: cde-lang-o057
      code: LANG-O057
      libelle: 'Participer à des jeux dans une autre langue : jeux de doigts, rondes, jeux dansés,
        mimes, jeux de cour, jeux de cartes.'
      niveau: MS
    - identite: cde-lang-o058
      code: LANG-O058
      libelle: Comparer des histoires lues en français et dans une autre langue.
      niveau: MS
  - code: S07
    nom: Écouter et comprendre différentes formes d’écrits
    competences:
    - identite: cde-lang-o059
      code: LANG-O059
      libelle: Repérer les outils fonctionnels utilisés quotidiennement en classe (étiquette du prénom,
        emploi du temps, affiches, etc.).
      niveau: PS
    - identite: cde-lang-o060
      code: LANG-O060
      libelle: Reconnaitre quelques écrits utilisés et produits en classe (comptines, recettes, carnet
        de lecteur).
      niveau: PS
    - identite: cde-lang-o061
      code: LANG-O061
      libelle: Reconnaitre un personnage, le nommer et le situer dans les illustrations.
      niveau: PS
    - identite: cde-lang-o062
      code: LANG-O062
      libelle: Comprendre des histoires où l’enchainement des actions peut être rattaché à des expériences
        connues de la vie quotidienne (le bain, le coucher, etc.).
      niveau: PS
    - identite: cde-lang-o063
      code: LANG-O063
      libelle: Reconnaitre, nommer et identifier la fonction de différents écrits rencontrés dans
        la vie courante.
      niveau: MS
    - identite: cde-lang-o064
      code: LANG-O064
      libelle: Prendre conscience de la notion de destinataire et de contenu de la requête adressée
        par un écrit.
      niveau: MS
    - identite: cde-lang-o065
      code: LANG-O065
      libelle: Identifier et utiliser quotidiennement des outils fonctionnels pour se repérer, s’organiser,
        ranger.
      niveau: MS
    - identite: cde-lang-o066
      code: LANG-O066
      libelle: Identifier et décrire le personnage principal et les personnages secondaires.
      niveau: MS
    - identite: cde-lang-o067
      code: LANG-O067
      libelle: Comprendre des histoires dont les actions sont organisées autour d’une structure répétitive
        (rencontres successives) et commencer à comprendre les informations implicites (émotions,
        états et sentiments des personnages).
      niveau: MS
    - identite: cde-lang-o068
      code: LANG-O068
      libelle: Différencier les types d’écrits et associer un écrit à un projet d’écriture ou de
        communication.
      niveau: GS
    - identite: cde-lang-o069
      code: LANG-O069
      libelle: Repérer et dégager la structure et l’organisation (mise en page, typographie) de formes
        d’écrits fréquemment utilisés en classe (structure de la lettre, de la recette, du conte,
        d’un écrit documentaire, d’une notice de fabrication).
      niveau: GS
    - identite: cde-lang-o070
      code: LANG-O070
      libelle: Construire les caractéristiques des personnages archétypaux (loup, princesse, ogre,
        sorcière, renard, fée, etc.).
      niveau: GS
    - identite: cde-lang-o071
      code: LANG-O071
      libelle: Comprendre des histoires où l’enchainement des actions est lié au destin de personnages
        centraux ou secondaires qui évoluent et interagissent, dans des lieux diversifiés.
      niveau: GS
    - identite: cde-lang-o072
      code: LANG-O072
      libelle: Comprendre les émotions, les intentions et les sentiments qui animent les personnages.
      niveau: GS
    - identite: cde-lang-o073
      code: LANG-O073
      libelle: Établir un lien entre la lecture effectuée et sa propre expérience.
      niveau: GS
  - code: S08
    nom: Apprendre le geste d’écriture
    competences:
    - identite: cde-lang-o074
      code: LANG-O074
      libelle: Participer aux activités de motricité générale, de motricité fine et aux exercices
        de graphismes.
      niveau: PS
    - identite: cde-lang-o075
      code: LANG-O075
      libelle: Guider son geste par le regard lorsqu’il trace ou écrit.
      niveau: PS
    - identite: cde-lang-o076
      code: LANG-O076
      libelle: Prendre des repères spatiaux sur le support utilisé pour tracer.
      niveau: PS
    - identite: cde-lang-o077
      code: LANG-O077
      libelle: Adopter une posture adaptée au geste d’écriture.
      niveau: MS
    - identite: cde-lang-o078
      code: LANG-O078
      libelle: Adopter une préhension correcte du stylo et s’entrainer à ne pas le lever en écrivant.
      niveau: MS
    - identite: cde-lang-o079
      code: LANG-O079
      libelle: Utiliser de façon coordonnée les quatre articulations qui servent à tenir et guider
        le crayon (épaule, coude, poignet, doigts).
      niveau: MS
    - identite: cde-lang-o080
      code: LANG-O080
      libelle: Tracer des lettres capitales.
      niveau: MS
    - identite: cde-lang-o081
      code: LANG-O081
      libelle: S’initier aux tracés de l’écriture cursive.
      niveau: MS
    - identite: cde-lang-o082
      code: LANG-O082
      libelle: Tenir correctement son stylo par la pince des doigts et utiliser de façon coordonnée
        les quatre articulations (épaule, coude, poignet, doigts).
      niveau: GS
    - identite: cde-lang-o083
      code: LANG-O083
      libelle: Travailler la ligature entre deux lettres.
      niveau: GS
    - identite: cde-lang-o084
      code: LANG-O084
      libelle: Tracer des lettres en écriture cursive, les enchainer.
      niveau: GS
  - code: S09
    nom: Produire de premiers écrits
    competences:
    - identite: cde-lang-o085
      code: LANG-O085
      libelle: Percevoir que l’écrit encode l’oral.
      niveau: PS
    - identite: cde-lang-o086
      code: LANG-O086
      libelle: Utiliser un support écrit connu.
      niveau: PS
    - identite: cde-lang-o087
      code: LANG-O087
      libelle: Mimer la posture et les gestes d’écriture de l’adulte lors de la production de traces
        qui s’apparentent à de l’écriture.
      niveau: PS
    - identite: cde-lang-o088
      code: LANG-O088
      libelle: Tracer volontairement des signes abstraits dont on comprend qu’il ne s’agit pas de
        dessins, mais de lettres.
      niveau: PS
    - identite: cde-lang-o089
      code: LANG-O089
      libelle: Comprendre que lorsque l’adulte lit un même écrit plusieurs fois, ce qu’il lit est
        toujours identique.
      niveau: MS
    - identite: cde-lang-o090
      code: LANG-O090
      libelle: Comprendre que l’écrit code des sons.
      niveau: MS
    - identite: cde-lang-o091
      code: LANG-O091
      libelle: Proposer au professeur, lors d’une activité de dictée à l’adulte, le contenu d’un
        court message, stabiliser un énoncé oral et le mémoriser pour pouvoir ensuite le dicter au
        professeur.
      niveau: MS
    - identite: cde-lang-o092
      code: LANG-O092
      libelle: Comparer la longueur d’un texte écrit et la durée du texte entendu.
      niveau: MS
    - identite: cde-lang-o093
      code: LANG-O093
      libelle: Savoir que le sens de la lecture est de gauche à droite et de haut en bas
      niveau: MS
    - identite: cde-lang-o094
      code: LANG-O094
      libelle: Chercher parmi les outils à sa disposition des modèles qui seront réutilisés dans
        un essai d’écriture.
      niveau: MS
    - identite: cde-lang-o095
      code: LANG-O095
      libelle: Segmenter l’oral en mots, les mots en syllabes, quelques syllabes en phonèmes.
      niveau: GS
    - identite: cde-lang-o096
      code: LANG-O096
      libelle: Comprendre que l’écrit encode l’oral et que les sons de la langue sont codés par des
        lettres.
      niveau: GS
    - identite: cde-lang-o097
      code: LANG-O097
      libelle: Suivre la trace écrite des yeux lors d’une relecture par l’adulte d’un message produit
        lors d’une dictée à l’adulte.
      niveau: GS
    - identite: cde-lang-o098
      code: LANG-O098
      libelle: Mémoriser la graphie d’un mot transparent, en s’appuyant sur la connaissance des lettres
        et la conscience phonologique et le retranscrire sur un support.
      niveau: GS
    - identite: cde-lang-o099
      code: LANG-O099
      libelle: Réinvestir ses premières connaissances relatives au principe alphabétique pour produire
        un écrit.
      niveau: GS
    - identite: cde-lang-o100
      code: LANG-O100
      libelle: Se repérer dans l’alphabet pour retrouver l’écriture d’une lettre nécessaire pour
        produire un écrit.
      niveau: GS
    - identite: cde-lang-o101
      code: LANG-O101
      libelle: Mémoriser l’écriture de mots transparents ou de syllabes connues pour les réutiliser
        dans une production d’écrit.
      niveau: GS
    - identite: cde-lang-o102
      code: LANG-O102
      libelle: 'Comprendre qu’il existe une norme pour écrire : ponctuation, majuscules, mise en
        page, etc.'
      niveau: GS
    - identite: cde-lang-o103
      code: LANG-O103
      libelle: 'Persévérer pour mener la production d’écrit à son terme : préparation, énonciation
        et révision.'
      niveau: GS
- code: PHYS
  nom: Agir, s’exprimer, comprendre à travers les activités physiques
  sous_domaines:
  - code: S01
    nom: Manipuler, courir, sauter, lancer, s’orienter
    competences:
    - identite: cde-phys-o001
      code: PHYS-O001
      libelle: Manipuler et lancer des objets avec des intentions motrices différents.
      niveau: PS
    - identite: cde-phys-o002
      code: PHYS-O002
      libelle: Courir de manière variée et coordonnée.
      niveau: PS
    - identite: cde-phys-o003
      code: PHYS-O003
      libelle: Sauter sans élan un obstacle.
      niveau: PS
    - identite: cde-phys-o004
      code: PHYS-O004
      libelle: Se situer dans un espace proche et connu en utilisant des indices présents dans l’environnement.
      niveau: PS
    - identite: cde-phys-o005
      code: PHYS-O005
      libelle: Lancer loin de manière coordonnée.
      niveau: MS
    - identite: cde-phys-o006
      code: PHYS-O006
      libelle: Courir vite en ligne droite sur une distance ou une durée courte.
      niveau: MS
    - identite: cde-phys-o007
      code: PHYS-O007
      libelle: Sauter sans élan plusieurs obstacles.
      niveau: MS
    - identite: cde-phys-o008
      code: PHYS-O008
      libelle: Se situer dans un espace élargi et connu grâce à des indices prélevés dans l’environnement.
      niveau: MS
    - identite: cde-phys-o009
      code: PHYS-O009
      libelle: Lancer loin et avec précision différents objets.
      niveau: GS
    - identite: cde-phys-o010
      code: PHYS-O010
      libelle: Courir de plus en plus longtemps sans s’arrêter.
      niveau: GS
    - identite: cde-phys-o011
      code: PHYS-O011
      libelle: Courir vite et franchir un obstacle sur une distance courte.
      niveau: GS
    - identite: cde-phys-o012
      code: PHYS-O012
      libelle: Coordonner ses actions et ses déplacements pour lancer et pour sauter haut ou loin.
      niveau: GS
    - identite: cde-phys-o013
      code: PHYS-O013
      libelle: Se situer dans un milieu moins connu grâce à des indices prélevés dans l’environnement.
      niveau: GS
  - code: S02
    nom: Tourner, se suspendre, se renverser, grimper, rouler, glisser, nager
    competences:
    - identite: cde-phys-o014
      code: PHYS-O014
      libelle: Développer de nouveaux équilibres par des modes de déplacements variés.
      niveau: PS
    - identite: cde-phys-o015
      code: PHYS-O015
