      niveau: PS
    - identite: cde-lang-o024
      code: LANG-O024
      libelle: Prendre part à l’oralisation d’un court texte mémorisé.
      niveau: PS
    - identite: cde-lang-o025
      code: LANG-O025
      libelle: Dire ce qu’on va faire.
      niveau: MS
    - identite: cde-lang-o026
