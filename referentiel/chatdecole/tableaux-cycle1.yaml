      niveau: MS
    - identite: cde-lang-o028
      code: LANG-O028
      libelle: Participer à des échanges en restant dans le propos.
      niveau: MS
    - identite: cde-lang-o029
      code: LANG-O029
      libelle: Décrire une action ou une activité qui a été menée par un autre élève.
      niveau: GS
    - identite: cde-lang-o030
      code: LANG-O030
      libelle: Se faire comprendre, par le truchement du langage, d’un adulte qui ne connait rien
