- code: MATH
  nom: L’acquisition des premiers outils mathématiques
  sous_domaines:
  - code: S01
    nom: Exprimer une quantité par un nombre
    competences:
    - identite: cde-math-o001
      code: MATH-O001
      libelle: Comprendre qu’une quantité d’objets ne dépend ni de la nature de ces objets ni de
        leur organisation spatiale.
      niveau: PS
    - identite: cde-math-o002
      code: MATH-O002
      libelle: 'Comprendre que : Si on ajoute un objet à une collection, le nombre qui désigne sa
        quantité est le suivant dans la suite orale des noms des nombres ; Dans la suite orale des
        noms des nombres, chaque nombre s’obtient en ajoutant un au nombre précédent.'
      niveau: PS
    - identite: cde-math-o003
      code: MATH-O003
      libelle: Dénombrer une collection d’objets (jusqu’à trois, voire quatre).
      niveau: PS
    - identite: cde-math-o004
      code: MATH-O004
      libelle: Constituer une collection (jusqu’à trois, voire quatre objets) d’un cardinal donné.
      niveau: PS
    - identite: cde-math-o005
      code: MATH-O005
      libelle: Comparer des quantités.
      niveau: PS
    - identite: cde-math-o006
      code: MATH-O006
      libelle: Composer et décomposer des nombres (deux, trois, voire quatre).
      niveau: PS
    - identite: cde-math-o007
      code: MATH-O007
      libelle: Manipuler et verbaliser des compositions et des décompositions de nombres. Cela permet
        d’installer le fait que, dans une composition, l’ordre ne compte pas ; ces compositions et
        décompositions permettent de dénombrer plus efficacement que par le comptage un à un.
      niveau: PS
    - identite: cde-math-o008
      code: MATH-O008
      libelle: Associer une quantité, le nom d’un nombre et une écriture chiffrée.
      niveau: PS
    - identite: cde-math-o009
      code: MATH-O009
      libelle: Connaitre la comptine numérique de un à six
      niveau: PS
    - identite: cde-math-o010
      code: MATH-O010
      libelle: Poursuivre la compréhension qu’une quantité d’objets ne dépend ni de leur nature ni
        de leur organisation spatiale.
      niveau: MS
    - identite: cde-math-o011
      code: MATH-O011
      libelle: 'Poursuivre la compréhension des faits suivants : Si on ajoute un objet à une collection,
        le nombre qui désigne sa quantité est le suivant dans la suite orale des noms des nombres
        ; Dans la suite orale des noms des nombres, chaque nombre s’obtient en ajoutant un au nombre
        précédent.'
      niveau: MS
    - identite: cde-math-o012
      code: MATH-O012
      libelle: Parcourir une collection en passant une et une seule fois par chacun de ses éléments.
      niveau: MS
    - identite: cde-math-o013
      code: MATH-O013
      libelle: Dénombrer une collection d’objets (jusqu’à six).
      niveau: MS
    - identite: cde-math-o014
      code: MATH-O014
      libelle: Constituer une collection d’un cardinal donné (jusqu’à six objets).
      niveau: MS
    - identite: cde-math-o015
      code: MATH-O015
      libelle: Comparer des quantités.
      niveau: MS
    - identite: cde-math-o016
      code: MATH-O016
      libelle: Composer et décomposer des nombres inférieurs ou égaux à six.
      niveau: MS
    - identite: cde-math-o017
      code: MATH-O017
      libelle: Manipuler et verbaliser des compositions et des décompositions de nombres. Cela permet
        d’installer le fait que, dans une composition, l’ordre ne compte pas ; ces compositions et
        décompositions permettent de dénombrer plus efficacement que par le comptage un à un.
      niveau: MS
    - identite: cde-math-o018
      code: MATH-O018
      libelle: Associer une quantité, le nom d’un nombre et une écriture chiffrée.
