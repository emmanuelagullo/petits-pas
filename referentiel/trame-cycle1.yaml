# Trame de référentiel — carnet de suivi des apprentissages, cycle 1
#
# ATTENTION : ceci est une TRAME DE TRAVAIL, pas un référentiel officiel.
# Elle reprend l'organisation en cinq domaines d'apprentissage de l'école
# maternelle et propose une formulation des compétences à la première personne,
# telle qu'on la trouve dans la plupart des carnets de réussite.
#
# Pour une installation historique non reprise :
#     python manage.py charger_referentiel referentiel/le-votre.yaml
# Cette commande est refusée pour une école utilisant les référentiels annuels.
# Pour préparer des sources versionnées au catalogue (sans adoption automatique),
# voir IMPORT-SOURCES-REFERENTIELS.org et referentiel/exemples/source-fictive.yaml.
# Ne pas déduire l'identité ou l'origine d'une ancienne compétence de son code.
#
# Champs d'une compétence :
#   code    : identifiant stable, propre à l'école (ne le changez plus ensuite)
#   libelle : la phrase telle qu'elle apparaîtra dans le carnet de l'enfant
#   niveau  : PS, MS ou GS — indicatif, sert à trier l'écran de saisie.
#             Un enfant de PS peut tout à fait valider une compétence GS.

format: 1
source:
  identifiant: petits-pas-trame-cycle1
  titre: Trame de démarrage Petits Pas — sélection provisoire
  provenance: Trame de travail proposée par Petits Pas pour la maternelle.
  licence: CC-BY-SA-4.0
  provisoire: true
version: '1'

domaines:

  - code: LANG
    nom: Mobiliser le langage dans toutes ses dimensions
    competences:
      - identite: LANG-01
        code: LANG-01
        niveau: PS
        libelle: "J'ose parler devant les autres"
        icone: parler
        formulations:
          - { code: LANG-01-F01, texte: "<prenom> prend la parole pendant un échange." }
      - { identite: LANG-02, code: LANG-02, niveau: PS, libelle: "Je dis mon prénom et celui de mes camarades" }
      - { identite: LANG-03, code: LANG-03, niveau: PS, libelle: "Je réponds aux questions qu'on me pose" }
      - { identite: LANG-04, code: LANG-04, niveau: PS, libelle: "Je dis une comptine que j'ai apprise" }
      - { identite: LANG-05, code: LANG-05, niveau: PS, libelle: "Je reconnais mon prénom écrit" }
      - { identite: LANG-06, code: LANG-06, niveau: PS, libelle: "Je tiens bien mon crayon" }
      - { identite: LANG-07, code: LANG-07, niveau: MS, libelle: "Je raconte une histoire que j'ai entendue", icone: livre }
      - { identite: LANG-08, code: LANG-08, niveau: MS, libelle: "Je fais des phrases que tout le monde comprend" }
      - { identite: LANG-09, code: LANG-09, niveau: MS, libelle: "Je repère des mots qui riment" }
      - { identite: LANG-10, code: LANG-10, niveau: MS, libelle: "J'écris mon prénom en majuscules" }
      - { identite: LANG-11, code: LANG-11, niveau: MS, libelle: "Je reconnais des lettres de l'alphabet" }
      - { identite: LANG-12, code: LANG-12, niveau: GS, libelle: "J'explique ce que j'ai fait et comment je m'y suis pris" }
      - { identite: LANG-13, code: LANG-13, niveau: GS, libelle: "Je découpe un mot en syllabes" }
      - { identite: LANG-14, code: LANG-14, niveau: GS, libelle: "J'entends le son du début d'un mot" }
      - { identite: LANG-15, code: LANG-15, niveau: GS, libelle: "J'écris mon prénom en écriture attachée" }
      - { identite: LANG-16, code: LANG-16, niveau: GS, libelle: "Je copie un mot en respectant le sens des lettres" }

  - code: PHYS
    nom: Agir, s'exprimer, comprendre à travers l'activité physique
    competences:
      - { identite: PHYS-01, code: PHYS-01, niveau: PS, libelle: "Je cours, je saute, je grimpe sans avoir peur" }
      - { identite: PHYS-02, code: PHYS-02, niveau: PS, libelle: "Je me déplace en tenant compte des autres" }
      - { identite: PHYS-03, code: PHYS-03, niveau: PS, libelle: "Je lance un objet vers une cible" }
      - { identite: PHYS-04, code: PHYS-04, niveau: MS, libelle: "Je garde mon équilibre sur un parcours" }
      - { identite: PHYS-05, code: PHYS-05, niveau: MS, libelle: "Je danse en suivant la musique" }
      - { identite: PHYS-06, code: PHYS-06, niveau: MS, libelle: "Je joue à un jeu collectif en respectant la règle" }
      - { identite: PHYS-07, code: PHYS-07, niveau: GS, libelle: "Je sais m'arrêter au signal" }
      - { identite: PHYS-08, code: PHYS-08, niveau: GS, libelle: "Je recommence pour faire mieux qu'avant" }
      - { identite: PHYS-09, code: PHYS-09, niveau: GS, libelle: "J'invente et je montre un déplacement aux autres" }

  - code: ART
    nom: Agir, s'exprimer, comprendre à travers les activités artistiques
    competences:
      - { identite: ART-01, code: ART-01, niveau: PS, libelle: "Je laisse une trace avec différents outils" }
      - { identite: ART-02, code: ART-02, niveau: PS, libelle: "Je chante avec le groupe" }
      - { identite: ART-03, code: ART-03, niveau: PS, libelle: "J'écoute un morceau de musique jusqu'au bout" }
      - { identite: ART-04, code: ART-04, niveau: MS, libelle: "Je choisis mes couleurs et mes outils exprès" }
      - { identite: ART-05, code: ART-05, niveau: MS, libelle: "Je dis ce que je vois dans une image" }
      - { identite: ART-06, code: ART-06, niveau: MS, libelle: "Je reproduis un rythme avec des percussions" }
      - { identite: ART-07, code: ART-07, niveau: GS, libelle: "Je dessine un bonhomme avec tous ses détails" }
      - { identite: ART-08, code: ART-08, niveau: GS, libelle: "Je parle de mon travail et de celui des autres" }
      - { identite: ART-09, code: ART-09, niveau: GS, libelle: "Je joue un petit rôle devant la classe" }

  - code: MATH
    nom: Acquérir les premiers outils mathématiques
    competences:
      - { identite: MATH-01, code: MATH-01, niveau: PS, libelle: "Je reconnais un, deux et trois objets d'un coup d'œil", icone: collection }
      - { identite: MATH-02, code: MATH-02, niveau: PS, libelle: "Je range les objets par couleur ou par forme" }
      - { identite: MATH-03, code: MATH-03, niveau: PS, libelle: "Je fais une tour, un puzzle, un encastrement" }
      - { identite: MATH-04, code: MATH-04, niveau: MS, libelle: "Je compte jusqu'à dix" }
      - { identite: MATH-05, code: MATH-05, niveau: MS, libelle: "Je donne le nombre d'objets d'une petite collection" }
      - { identite: MATH-06, code: MATH-06, niveau: MS, libelle: "Je continue un algorithme commencé" }
      - { identite: MATH-07, code: MATH-07, niveau: MS, libelle: "Je compare des longueurs et des tailles" }
      - { identite: MATH-08, code: MATH-08, niveau: GS, libelle: "Je compte jusqu'à trente" }
      - { identite: MATH-09, code: MATH-09, niveau: GS, libelle: "Je fabrique une collection qui a autant d'objets qu'une autre" }
      - { identite: MATH-10, code: MATH-10, niveau: GS, libelle: "Je sais ce qui se passe quand j'ajoute ou j'enlève" }
      - { identite: MATH-11, code: MATH-11, niveau: GS, libelle: "J'écris les chiffres de 1 à 10" }
      - { identite: MATH-12, code: MATH-12, niveau: GS, libelle: "Je reconnais et je nomme les formes simples" }

  - code: MOND
    nom: Explorer le monde
    competences:
      - { identite: MOND-01, code: MOND-01, niveau: PS, libelle: "Je repère les moments de la journée à l'école" }
      - { identite: MOND-02, code: MOND-02, niveau: PS, libelle: "Je nomme les parties de mon corps" }
      - { identite: MOND-03, code: MOND-03, niveau: PS, libelle: "Je me lave les mains tout seul" }
      - { identite: MOND-04, code: MOND-04, niveau: MS, libelle: "Je me repère dans l'école et dans la classe" }
      - { identite: MOND-05, code: MOND-05, niveau: MS, libelle: "Je range des images dans l'ordre de l'histoire" }
      - { identite: MOND-06, code: MOND-06, niveau: MS, libelle: "Je prends soin des plantes et des animaux de la classe" }
      - { identite: MOND-07, code: MOND-07, niveau: MS, libelle: "Je me sers des ciseaux pour découper" }
      - { identite: MOND-08, code: MOND-08, niveau: GS, libelle: "Je sais quel jour on est et je lis la date" }
      - { identite: MOND-09, code: MOND-09, niveau: GS, libelle: "Je raconte ce que j'ai observé et ce que j'ai compris" }
      - { identite: MOND-10, code: MOND-10, niveau: GS, libelle: "Je fabrique un objet en suivant une fiche" }
      - { identite: MOND-11, code: MOND-11, niveau: GS, libelle: "Je me sers de la tablette ou de l'ordinateur pour travailler" }
