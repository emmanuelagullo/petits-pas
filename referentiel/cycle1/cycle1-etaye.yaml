- code: MATH
  nom: L’acquisition des premiers outils mathématiques
  sous_domaines:
  - code: S01
    nom: Exprimer une quantité par un nombre
    competences:
    - identite: math-o001
      code: MATH-O001
      libelle: 'Objectif : Comprendre qu’une quantité d’objets ne dépend ni de la nature de ces objets
        ni de leur organisation spatiale.'
      niveau: PS
    - identite: math-o002
      code: MATH-O002
      libelle: 'Objectif : Comprendre que : • si on ajoute un objet à une collection, le nombre qui désigne
        sa quantité est le suivant dans la suite orale des noms des nombres ; • dans la suite orale des
        noms des nombres, chaque nombre s’obtient en ajoutant un au nombre précédent.'
      niveau: PS
    - identite: o-denombrer-jusqua3voire4
      code: MATH-O003
      libelle: 'Objectif : Dénombrer une collection d’objets (jusqu’à trois, voire quatre).'
      niveau: PS
    - identite: math-o004
      code: MATH-O004
      libelle: 'Objectif : Constituer une collection (jusqu’à trois, voire quatre objets) d’un cardinal
        donné.'
      niveau: PS
