      code: MATH-O007
      libelle: 'Objectif : Manipuler et verbaliser des compositions et des décompositions de nombres.
        Cela permet d’installer le fait que, dans une composition, l’ordre ne compte pas ; ces compositions
        et décompositions permettent de dénombrer plus efficacement que par le comptage un à un.'
