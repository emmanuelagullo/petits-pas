<text x="965" y="263" font-size="12" font-weight="normal" fill="#243c35">32 px</text>
<text x="830" y="301" font-size="20" font-weight="bold" fill="#243c35">Prendre soin</text>
<text x="830" y="327" font-size="20" font-weight="bold" fill="#243c35">des plantations</text>
<text x="830" y="353" font-size="14" font-weight="normal" fill="#243c35">Petits Pas étayé · R09</text>
<text x="830" y="391" font-size="15" font-weight="normal" fill="#243c35">Association existante.</text>
<text x="830" y="415" font-size="15" font-weight="normal" fill="#243c35">Réserve pour VIVANT-O003 :</text>
<text x="830" y="439" font-size="15" font-weight="normal" fill="#243c35">la plante exclut les élevages.</text>
<text x="40" y="519" font-size="22" font-weight="bold" fill="#243c35">Règle proposée : seulement sans photo dans le carnet</text>
<text x="40" y="554" font-size="17" font-weight="normal" fill="#243c35">Sans photo : illustration. Avec des photos : choisir de garder aussi l’illustration ou de la cacher.</text>
<text x="40" y="586" font-size="17" font-weight="normal" fill="#243c35">Les photos collectives et personnelles des traces affichées restent toutes dans le carnet.</text>
<text x="40" y="623" font-size="16" font-weight="normal" fill="#243c35">Les illustrations présentent les activités ; elles ne constituent pas une production de l’enfant.</text>
<text x="40" y="663" font-size="13" font-weight="normal" fill="#243c35">Livre : Petits Pas · Crayon et pousse : OpenMoji, HfG Schwäbisch Gmünd et contributeurs, 17.0.0.</text>
