# Configuration incluse par le petit projet Pages destinataire.
image: python:3.12-slim-bookworm

stages:
  - publication

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $PWA_SOURCE_PROJECT == "petits-pas/petits-pas" && ($PWA_SOURCE_REF == "main" || $PWA_SOURCE_TAG =~ /^[0-9]+\.[0-9]+(\.[0-9]+)?$/)'
    - when: never

default:
  tags:
    - ci.inria.fr
    - small

pages:
  stage: publication
  resource_group: pwa-pages
  script:
    # Télécharger les scripts et le wheel épinglé au commit source, sans jeton personnel.
    - |
      python3 - <<'PY'
      import os, re, urllib.parse, urllib.request
      from pathlib import Path
      commit = os.environ['PWA_SOURCE_SHA']
      assert re.fullmatch(r'[a-f0-9]{40}', commit)
      base = (os.environ['CI_API_V4_URL'] + '/projects/petits-pas%2Fpetits-pas'
              + '/repository/files/')
      for source_path, filename in [
          ('scripts/preparer-publication-pwa.py', 'preparer-publication-pwa.py'),
          ('scripts/publication.py', 'publication.py'),
          ('requirements-communs.txt', 'requirements-communs.txt'),
      ]:
          source_url = base + urllib.parse.quote(source_path, safe='') + '/raw?ref=' + commit
          with urllib.request.urlopen(source_url, timeout=60) as source:
              Path(filename).write_bytes(source.read())
      PY
    - python3 -m pip install --no-deps -r requirements-communs.txt
    - python3 preparer-publication-pwa.py --destination public --pages-url "$CI_PAGES_URL"
  pages:
    publish: public
  artifacts:
    paths:
      - public
      - publication-pwa.json
    expire_in: 30 days
  environment:
    name: prototype-pwa
    url: "$CI_PAGES_URL"
