# Configuration incluse par le petit projet Pages destinataire.
image: python:3.12-slim-bookworm

stages:
  - publication

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $PWA_SOURCE_PROJECT == "petits-pas/petits-pas" && ($PWA_SOURCE_REF == "main" || $PWA_SOURCE_TAG =~ /^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$/)'
    - when: never

default:
  tags:
    - ci.inria.fr
    - small

pages:
  stage: publication
  resource_group: pwa-pages
  script:
    # Télécharger le préparateur du commit exact demandé, sans jeton personnel.
    - |
      python3 - <<'PY'
      import os, re, urllib.request
      from pathlib import Path
      commit = os.environ['PWA_SOURCE_SHA']
      assert re.fullmatch(r'[a-f0-9]{40}', commit)
      url = (os.environ['CI_API_V4_URL'] + '/projects/petits-pas%2Fpetits-pas'
             + '/repository/files/scripts%2Fpreparer-publication-pwa.py/raw?ref=' + commit)
      for filename in ['preparer-publication-pwa.py', 'publication.py']:
          source_url = url.replace('preparer-publication-pwa.py', filename)
          with urllib.request.urlopen(source_url, timeout=60) as source:
              Path(filename).write_bytes(source.read())
      PY
    - python3 preparer-publication-pwa.py --destination public --pages-url "$CI_PAGES_URL"
  pages:
    publish: public
  artifacts:
    paths:
      - public
      - publication-pwa.json
    expire_in: 30 days
  environment:
    name: prototype-pwa
    url: "$CI_PAGES_URL"
