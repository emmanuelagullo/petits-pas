image: python:3.12-slim-bookworm

stages:
  - test
  - integration
  - publication

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - ci.inria.fr
    - small

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEPENDANCES: verrouillees
  POSTGRES_DB: petits_pas_ci
  POSTGRES_USER: petits_pas_ci
  POSTGRES_PASSWORD: petits_pas_ci
  DATABASE_URL: "postgresql://petits_pas_ci:petits_pas_ci@postgresql:5432/petits_pas_ci"
  CARNET_SECRET_KEY: "ci-only-secret-key-never-used-in-production"
  CARNET_DEBUG: "1"
  CARNET_HOSTS: "localhost,127.0.0.1"

cache:
  key:
    prefix: "$DEPENDANCES"
    files:
      - requirements.txt
      - requirements.lock
  paths:
    - .cache/pip

test:
  stage: test
  parallel:
    matrix:
      - DEPENDANCES: verrouillees
      - DEPENDANCES: django-5.2
  services:
    - name: postgres:16-alpine
      alias: postgresql
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git libpango-1.0-0 libpangoft2-1.0-0
    - |
      if [[ "$DEPENDANCES" == "verrouillees" ]]; then
        python3 -m pip install --requirement requirements.lock
      else
        python3 -m pip install \
          --requirement requirements.txt \
          "Django>=5.2,<5.3"
      fi
    - python3 -m pip check
    - |
      python3 - <<'PY'
      import os
      import time

      import psycopg

      for tentative in range(30):
          try:
              with psycopg.connect(os.environ["DATABASE_URL"]):
                  break
          except psycopg.OperationalError:
              if tentative == 29:
                  raise
              time.sleep(1)
      PY
  script:
    - python3 manage.py collectstatic --noinput
    - python3 manage.py test
    - python3 manage.py makemigrations --check --dry-run
    - bash -n start-atelier.sh start-persistent.sh start-render.sh scripts/*.sh
    - git show --check --format= --no-renames "$CI_COMMIT_SHA"

deploiement-ephemere:
  stage: integration
  tags:
    - ci.inria.fr
    - medium
  services:
    - name: postgres:15-alpine
      alias: postgresql
    - name: quay.io/minio/minio:latest
      alias: minio
      command: ["server", "/data"]
  variables:
    POSTGRES_DB: petits_pas_ci
    POSTGRES_USER: petits_pas_ci
    POSTGRES_PASSWORD: petits_pas_ci
    DATABASE_URL: "postgresql://petits_pas_ci:petits_pas_ci@postgresql:5432/petits_pas_ci"
    MINIO_ROOT_USER: petits_pas_ci
    MINIO_ROOT_PASSWORD: petits_pas_ci_secret
    CARNET_S3_BUCKET: petits-pas-ci
    CARNET_S3_ENDPOINT_URL: "http://minio:9000"
    CARNET_S3_REGION: us-east-1
    CARNET_S3_ACCESS_KEY: petits_pas_ci
    CARNET_S3_SECRET_KEY: petits_pas_ci_secret
    CARNET_S3_URL_EXPIRATION: "300"
    CARNET_SECRET_KEY: "ci-only-persistent-secret-key-never-used-in-production"
    CARNET_DEBUG: "0"
    CARNET_HOSTS: "localhost,127.0.0.1"
    CARNET_CSRF_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    CARNET_ENVIRONNEMENT_EPHEMERE: "oui"
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends curl git libpango-1.0-0 libpangoft2-1.0-0 postgresql-client
    - python3 -m pip install --requirement requirements.lock
    - python3 -m pip check
  script:
    - scripts/exercer-deploiement-ephemere.sh

site-public:
  stage: test
  image:
    name: registry.gitlab.com/pages/hugo/hugo_extended:latest
    entrypoint: [""]
  script:
    - hugo --source site --baseURL "https://example.invalid/" --cleanDestinationDir --minify
  artifacts:
    paths:
      - site/public
    expire_in: 1 week

pages:
  stage: publication
  image:
    name: registry.gitlab.com/pages/hugo/hugo_extended:latest
    entrypoint: [""]
  script:
    - hugo --source site --baseURL "$CI_PAGES_URL/" --cleanDestinationDir --minify
  pages:
    publish: site/public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
