# Inria valide ; la Forge Éducation publie les versions déjà qualifiées.
include:
  - local: /.gitlab/ci/validation.yml
    rules:
      - if: '$CI_SERVER_HOST != "forge.apps.education.fr"'
  - local: /.gitlab/ci/publication-education.yml
    rules:
      - if: '$CI_SERVER_HOST == "forge.apps.education.fr"'
