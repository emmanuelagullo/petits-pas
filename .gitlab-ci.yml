image: python:3.12-slim-bookworm

stages:
  - test
  - integration
  - construction
  - publication

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - ci.inria.fr
    - small

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEPENDANCES: verrouillees
  POSTGRES_DB: petits_pas_ci
  POSTGRES_USER: petits_pas_ci
  POSTGRES_PASSWORD: petits_pas_ci
  DATABASE_URL: "postgresql://petits_pas_ci:petits_pas_ci@postgresql:5432/petits_pas_ci"
  CARNET_SECRET_KEY: "ci-only-secret-key-never-used-in-production"
  CARNET_DEBUG: "1"
  CARNET_HOSTS: "localhost,127.0.0.1"

cache:
  key:
    prefix: "$DEPENDANCES"
    files:
      - requirements.txt
      - requirements.lock
  paths:
    - .cache/pip

qualite-depot:
  stage: test
  cache: []
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  script:
    - git show --check --format= --no-renames "$CI_COMMIT_SHA"

test:
  stage: test
  # Keep this list aligned with every file that can affect the application or
  # its test environment. A CI change deliberately exercises the full matrix.
  rules:
    - changes:
        - .env.example
        - .gitlab-ci.yml
        - "*.py"
        - "carnet/**/*"
        - compose.local.yaml
        - "referentiel/**/*"
        - requirements.lock
        - requirements.txt
        - "scripts/**/*"
        - site/data/demonstration.yaml
        - "start-*.sh"
        - "suivi/**/*"
        - trame-cycle1.yaml
    - when: never
  parallel:
    matrix:
      - DEPENDANCES: verrouillees
      - DEPENDANCES: django-5.2
  services:
    - name: postgres:16-alpine
      alias: postgresql
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git libpango-1.0-0 libpangoft2-1.0-0
    - |
      if [[ "$DEPENDANCES" == "verrouillees" ]]; then
        python3 -m pip install --requirement requirements.lock
      else
        python3 -m pip install \
          --requirement requirements.txt \
          "Django>=5.2,<5.3"
      fi
    - python3 -m pip check
    - |
      python3 - <<'PY'
      import os
      import time

      import psycopg

      for tentative in range(30):
          try:
              with psycopg.connect(os.environ["DATABASE_URL"]):
                  break
          except psycopg.OperationalError:
              if tentative == 29:
                  raise
              time.sleep(1)
      PY
  script:
    - python3 manage.py collectstatic --noinput
    - python3 manage.py test
    - python3 manage.py makemigrations --check --dry-run
    - bash -n start-atelier.sh start-persistent.sh start-render.sh scripts/*.sh

deploiement-ephemere:
  stage: integration
  rules:
    - changes:
        - .env.example
        - .gitlab-ci.yml
        - "*.py"
        - "carnet/**/*"
        - compose.local.yaml
        - "referentiel/**/*"
        - requirements.lock
        - requirements.txt
        - "scripts/**/*"
        - site/data/demonstration.yaml
        - "start-*.sh"
        - "suivi/**/*"
        - trame-cycle1.yaml
    - when: never
  tags:
    - ci.inria.fr
    - medium
  services:
    - name: postgres:15-alpine
      alias: postgresql
    - name: quay.io/minio/minio:latest
      alias: minio
      command: ["server", "/data"]
  variables:
    POSTGRES_DB: petits_pas_ci
    POSTGRES_USER: petits_pas_ci
    POSTGRES_PASSWORD: petits_pas_ci
    DATABASE_URL: "postgresql://petits_pas_ci:petits_pas_ci@postgresql:5432/petits_pas_ci"
    MINIO_ROOT_USER: petits_pas_ci
    MINIO_ROOT_PASSWORD: petits_pas_ci_secret
    CARNET_S3_BUCKET: petits-pas-ci
    CARNET_S3_ENDPOINT_URL: "http://minio:9000"
    CARNET_S3_REGION: us-east-1
    CARNET_S3_ACCESS_KEY: petits_pas_ci
    CARNET_S3_SECRET_KEY: petits_pas_ci_secret
    CARNET_S3_URL_EXPIRATION: "300"
    CARNET_SECRET_KEY: "ci-only-persistent-secret-key-never-used-in-production"
    CARNET_DEBUG: "0"
    CARNET_FORCER_HTTPS: "oui"
    CARNET_HOSTS: "localhost,127.0.0.1"
    CARNET_CSRF_ORIGINS: "https://localhost:8000,https://127.0.0.1:8000"
    CARNET_ENVIRONNEMENT_EPHEMERE: "oui"
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends curl git libpango-1.0-0 libpangoft2-1.0-0 postgresql-client
    - python3 -m pip install --requirement requirements.lock
    - python3 -m pip check
  script:
    - scripts/exercer-deploiement-ephemere.sh

.site-public-rules:
  rules:
    - changes:
        - .env.example
        - .gitlab-ci.yml
        - MATRICE-AUTORISATIONS.org
        - MODELE-IDENTITES-ET-AFFECTATIONS.org
        - PLAN-IMPLEMENTATION-AUTORISATIONS.org
        - POLITIQUE-AUTORISATION.org
        - "*.py"
        - "carnet/**/*"
        - "referentiel/**/*"
        - requirements.lock
        - requirements.txt
        - "scripts/**/*"
        - "site/**/*"
        - "start-*.sh"
        - "suivi/**/*"
        - trame-cycle1.yaml
    - when: never

captures-demonstration:
  extends: .site-public-rules
  stage: test
  image:
    # Playwright 1.63.0 and its Chromium build, pinned by manifest digest.
    name: mcr.microsoft.com/playwright/python@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
    entrypoint: [""]
  cache: []
  variables:
    DATABASE_URL: ""
    CARNET_S3_BUCKET: ""
    CARNET_DEBUG: "1"
    CARNET_HOSTS: "127.0.0.1,localhost"
    PORT: "8000"
  before_script:
    - python3 -m pip install --requirement requirements.lock
    - python3 -m pip install "playwright==1.63.0"
    - python3 -m pip check
  script:
    - test ! -e carnet.sqlite3
    - sh scripts/preparer-site.sh
    - python3 scripts/verifier-guide-pratique.py
    - |
      bash ./start-render.sh >.ci-captures-demonstration.log 2>&1 &
      application_pid=$!
      trap 'kill "$application_pid" 2>/dev/null || true; wait "$application_pid" 2>/dev/null || true' EXIT
      python3 scripts/capturer-demonstration.py \
        --base-url "http://127.0.0.1:$PORT" \
        --output site/static/captures
      python3 scripts/verifier-captures-demonstration.py \
        --input site/static/captures
      kill "$application_pid"
      wait "$application_pid" || true
      trap - EXIT
  artifacts:
    when: always
    paths:
      - site/static/captures
      - .ci-captures-demonstration.log
    expire_in: 1 week

.hugo:
  image:
    # Immutable image currently providing Hugo Extended 0.140.2.
    name: registry.gitlab.com/pages/hugo/hugo_extended@sha256:ff07c15f0ff5876c7a737d07b906d48802e7fcd1bba02f648fae63fda57ddb56
    entrypoint: [""]
  cache: []
  before_script:
    - sh scripts/preparer-site.sh
    - hugo version

site-public:
  extends:
    - .hugo
    - .site-public-rules
  stage: construction
  needs:
    - job: captures-demonstration
      artifacts: true
  script:
    - hugo --source site --baseURL "https://example.invalid/" --cleanDestinationDir --minify --panicOnWarning
  artifacts:
    paths:
      - site/public
    expire_in: 1 week

pages:
  extends: .hugo
  stage: publication
  needs:
    - job: captures-demonstration
      artifacts: true
  script:
    - hugo --source site --baseURL "$CI_PAGES_URL/" --cleanDestinationDir --minify --panicOnWarning
  pages:
    publish: site/public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .env.example
        - .gitlab-ci.yml
        - MATRICE-AUTORISATIONS.org
        - MODELE-IDENTITES-ET-AFFECTATIONS.org
        - PLAN-IMPLEMENTATION-AUTORISATIONS.org
        - POLITIQUE-AUTORISATION.org
        - "*.py"
        - "carnet/**/*"
        - "referentiel/**/*"
        - requirements.lock
        - requirements.txt
        - "scripts/**/*"
        - "site/**/*"
        - "start-*.sh"
        - "suivi/**/*"
        - trame-cycle1.yaml
