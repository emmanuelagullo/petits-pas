name: Paquets autonomes Linux et Windows (prototype)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]*']
    paths:
      - .github/workflows/paquets-locaux.yml
      - requirements-paquet-local.txt
      - requirements-communs.txt
      - scripts/**
      - carnet/**
      - comptes/**
      - suivi/**
      - referentiel/**
      - site/data/demonstration.yaml
      - CHANGELOG.org

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-pango
      - name: Tester les données autonomes
        shell: pwsh
        run: |
          python -m pip install --no-deps -r requirements-communs.txt
          if ($LASTEXITCODE -ne 0) { throw "Installation du socle impossible" }
          python -m unittest discover -s scripts -p test_paquet_local.py
          if ($LASTEXITCODE -ne 0) { throw "Échec des tests paquet_local" }
          python -m unittest discover -s scripts -p test_essai_local.py
          if ($LASTEXITCODE -ne 0) { throw "Échec des tests essai_local" }
          python -m unittest discover -s scripts -p test_ecole_fictive.py
          if ($LASTEXITCODE -ne 0) { throw "Échec des tests ecole_fictive" }
          python -m unittest discover -s scripts -p test_apercu_local.py
          if ($LASTEXITCODE -ne 0) { throw "Échec des tests apercu_local" }
          python -m unittest discover -s scripts -p test_manifestes_publication.py
          python -m unittest discover -s scripts -p test_publication_automatique.py
          if ($LASTEXITCODE -ne 0) { throw "Échec des tests de publication" }
      - name: Construire et contrôler
        shell: pwsh
        env:
          PETITS_PAS_PANGO_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: |
          $python = (Get-Command python).Source
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/construire-paquet-windows.ps1 -PythonExecutable $python
      - name: Vérifier l'installation et le lanceur Windows
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File dist/PetitsPas/Installer-PetitsPas.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installation Windows impossible.' }
          $racine = Join-Path $env:LOCALAPPDATA 'Programs\PetitsPas'
          $version = (Get-Content -LiteralPath (Join-Path $racine 'actuelle') -Raw).Trim()
          $demarrage = Join-Path $racine "$version\Demarrer-PetitsPas.cmd"
          & $demarrage --verifier-distribution
          if ($LASTEXITCODE -ne 0) { throw 'Le lanceur Windows installé a échoué.' }
      - name: Construire et vérifier l'installateur graphique Windows
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installation du compilateur Inno Setup impossible.' }
          python -m pas_communs.installateur_windows --configuration scripts/installateur-windows.json --verifier
          if ($LASTEXITCODE -ne 0) { throw 'Construction ou verification du setup Windows impossible.' }
          $journal = Join-Path $env:LOCALAPPDATA 'petits-pas\logs\dernier-demarrage.log'
          if (!(Test-Path $journal) -or !(Select-String -LiteralPath $journal -Pattern 'Django .*PyWebView' -Quiet)) {
            throw "Le controle du paquet Windows n'a pas ete journalise."
          }
      - name: Préparer le manifeste Windows
        shell: pwsh
        run: |
          $version = (Get-Content version-application.txt -Raw).Trim()
          python scripts/manifeste-publication.py --mode programme --target windows-x64 --destination dist/publication-windows.json dist/PetitsPas-windows.zip "dist/PetitsPas-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Manifeste Windows invalide.' }
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-windows
          path: |
            dist/PetitsPas-windows.zip
            dist/publication-windows.json
            dist/notes-version.md
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-Setup-windows
          path: dist/PetitsPas-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Installer GTK, WebKit et Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libpango-1.0-0 libpangoft2-1.0-0
      - name: Construire avec le Python lié à PyGObject
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements-communs.txt
          /usr/bin/python3 -c 'import gi; gi.require_version("WebKit2", "4.1")'
          .venv/bin/python -m unittest discover -s scripts -p test_paquet_local.py
          .venv/bin/python -m unittest discover -s scripts -p test_essai_local.py
          .venv/bin/python -m unittest discover -s scripts -p test_ecole_fictive.py
          .venv/bin/python -m unittest discover -s scripts -p test_apercu_local.py
          .venv/bin/python -m unittest discover -s scripts -p test_manifestes_publication.py
          PATH="/usr/bin:$PATH" bash scripts/construire-paquet-linux.sh
      - name: Préparer le manifeste Linux
        run: .venv/bin/python scripts/manifeste-publication.py --mode programme --target linux-ubuntu24.04-x86_64 --destination dist/publication-linux.json dist/PetitsPas-linux.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-linux
          path: |
            dist/PetitsPas-linux.tar.gz
            dist/publication-linux.json
            dist/notes-version.md
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-15
    # Non bloquant : un échec macOS ne doit pas empêcher la publication de Windows et Linux, dont
    # la conclusion déclenche publier-programmes.yml. Le retirer après plusieurs publications vertes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer Pango (embarqué dans le .app)
        run: brew install pango
      - name: Tester les données autonomes
        run: |
          python -m pip install --no-deps -r requirements-communs.txt
          python -m unittest discover -s scripts -p test_paquet_local.py
          python -m unittest discover -s scripts -p test_essai_local.py
          python -m unittest discover -s scripts -p test_ecole_fictive.py
          python -m unittest discover -s scripts -p test_apercu_local.py
          python -m unittest discover -s scripts -p test_manifestes_publication.py
      - name: Construire et contrôler le programme macOS
        run: bash scripts/construire-paquet-macos.sh
      - name: Préparer le manifeste macOS
        run: python scripts/manifeste-publication.py --mode programme --target macos-arm64 --destination dist/publication-macos.json dist/PetitsPas-macos-arm64.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-macos
          path: |
            dist/PetitsPas-macos-arm64.dmg
            dist/publication-macos.json
            dist/notes-version.md
          if-no-files-found: error
          retention-days: 30
