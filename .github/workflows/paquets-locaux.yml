name: Paquets autonomes Linux et Windows (prototype)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/paquets-locaux.yml
      - requirements-paquet-local.txt
      - scripts/**
      - carnet/**
      - comptes/**
      - suivi/**
      - referentiel/**

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Tester les données autonomes
        run: python -m unittest discover -s scripts -p test_paquet_local.py
      - name: Construire et contrôler
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/construire-paquet-windows.ps1 -PythonExecutable $python
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-windows
          path: dist/PetitsPas-windows.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Installer GTK, WebKit et Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libpango-1.0-0 libpangoft2-1.0-0
      - name: Construire avec le Python lié à PyGObject
        run: |
          /usr/bin/python3 -c 'import gi; gi.require_version("WebKit2", "4.1")'
          /usr/bin/python3 -m unittest discover -s scripts -p test_paquet_local.py
          PATH="/usr/bin:$PATH" bash scripts/construire-paquet-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-linux
          path: dist/PetitsPas-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
