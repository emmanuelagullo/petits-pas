name: Paquets autonomes Linux et Windows (prototype)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]*']
    paths:
      - .github/workflows/paquets-locaux.yml
      - requirements-paquet-local.txt
      - scripts/**
      - carnet/**
      - comptes/**
      - suivi/**
      - referentiel/**
      - site/data/demonstration.yaml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-pango
      - name: Tester les données autonomes
        run: |
          python -m unittest discover -s scripts -p test_paquet_local.py
          python -m unittest discover -s scripts -p test_essai_local.py
      - name: Construire et contrôler
        shell: pwsh
        env:
          PETITS_PAS_PANGO_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: |
          $python = (Get-Command python).Source
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/construire-paquet-windows.ps1 -PythonExecutable $python
      - name: Vérifier l'installation et le lanceur Windows
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File dist/PetitsPas/Installer-PetitsPas.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installation Windows impossible.' }
          $racine = Join-Path $env:LOCALAPPDATA 'Programs\PetitsPas'
          $version = (Get-Content -LiteralPath (Join-Path $racine 'actuelle') -Raw).Trim()
          $demarrage = Join-Path $racine "$version\Demarrer-PetitsPas.cmd"
          & $demarrage --verifier-distribution
          if ($LASTEXITCODE -ne 0) { throw 'Le lanceur Windows installé a échoué.' }
      - name: Construire et vérifier l'installateur graphique Windows
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installation du compilateur Inno Setup impossible.' }
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (!$iscc) { throw 'Compilateur ISCC.exe introuvable.' }
          $version = (Get-Content -LiteralPath version-application.txt -Raw).Trim()
          $output = Join-Path (Get-Location) 'dist'
          & $iscc "/DAppVersion=$version" "/DOutputDir=$output" scripts/PetitsPas-Windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Construction du setup Windows impossible.' }
          $setup = "dist/PetitsPas-Setup-$version-x64.exe"
          if (!(Test-Path $setup)) { throw 'Setup Windows absent.' }
          # Le setup est une application graphique : l'appel direct depuis
          # PowerShell peut rendre la main avant la fin de l'installation.
          $installation = Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installation du setup Windows impossible (code $($installation.ExitCode))." }
          $cle = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PetitsPas.Local.EmmanuelAgullo_is1'
          if (!(Test-Path $cle)) { throw "Installation terminée mais entrée Windows absente : $cle" }
          $dossier = (Get-ItemProperty -Path $cle).InstallLocation
          if (!$dossier) { throw 'Dossier installe absent de la fiche Windows.' }
          $exe = Join-Path $dossier 'PetitsPas.exe'
          if (!(Test-Path $exe)) { throw "Exécutable installé introuvable : $exe" }
          $raccourci = Join-Path ([Environment]::GetFolderPath('Programs')) 'Petits Pas.lnk'
          if (!(Test-Path $raccourci)) { throw 'Raccourci du menu Démarrer introuvable.' }
          $cible = (New-Object -ComObject WScript.Shell).CreateShortcut($raccourci).TargetPath
          if ($cible -ne $exe) { throw "Le raccourci ouvre $cible au lieu de $exe." }
          $verification = Start-Process -FilePath $exe -ArgumentList '--verifier-distribution' -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw 'Le paquet installé par le setup est invalide.' }
          $journal = Join-Path $env:LOCALAPPDATA 'petits-pas\logs\dernier-demarrage.log'
          if (!(Test-Path $journal) -or !(Select-String -LiteralPath $journal -Pattern 'Django .*PyWebView' -Quiet)) {
            throw "Le controle du paquet Windows n'a pas ete journalise."
          }
          $miseAJour = Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($miseAJour.ExitCode -ne 0) { throw "Réinstallation du setup Windows impossible (code $($miseAJour.ExitCode))." }
          $verification = Start-Process -FilePath $exe -ArgumentList '--verifier-distribution' -Wait -PassThru
          if ($verification.ExitCode -ne 0) { throw 'Le paquet réinstallé par le setup est invalide.' }
          $uninstall = Join-Path $dossier 'unins000.exe'
          $desinstallation = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($desinstallation.ExitCode -ne 0) { throw "Désinstallation du setup Windows impossible (code $($desinstallation.ExitCode))." }
          if (Test-Path $exe) { throw 'Le programme est encore présent après désinstallation.' }
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-windows
          path: dist/PetitsPas-windows.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-Setup-windows
          path: dist/PetitsPas-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Installer GTK, WebKit et Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libpango-1.0-0 libpangoft2-1.0-0
      - name: Construire avec le Python lié à PyGObject
        run: |
          /usr/bin/python3 -c 'import gi; gi.require_version("WebKit2", "4.1")'
          /usr/bin/python3 -m unittest discover -s scripts -p test_paquet_local.py
          /usr/bin/python3 -m unittest discover -s scripts -p test_essai_local.py
          PATH="/usr/bin:$PATH" bash scripts/construire-paquet-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: PetitsPas-linux
          path: dist/PetitsPas-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
