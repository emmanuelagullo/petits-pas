name: Paquet autonome Windows (prototype)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Construire et contrôler
        shell: pwsh
        run: ./scripts/construire-paquet-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PetitsPas-windows
          path: dist/PetitsPas-windows.zip
          if-no-files-found: error
          retention-days: 7
