include:
  - local: /.gitlab/ci/runners-education.yml

image: python:3.12-slim-bookworm

stages:
  - preparation
  - publication

# Chaque push de branche ou de tag lance le profil léger ; reprise manuelle possible.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

disponibilite-inria:
  stage: preparation
  script:
    - python3 scripts/preparer-pipeline-education.py --destination publication-education-enfant.yml
  artifacts:
    expire_in: 1 week
    paths:
      - publication-education-enfant.yml

publication:
  stage: publication
  needs:
    - job: disponibilite-inria
      artifacts: true
  inherit:
    default: false
    variables: false
  trigger:
    include:
      - artifact: publication-education-enfant.yml
        job: disponibilite-inria
    strategy: mirror
    forward:
      yaml_variables: false
      pipeline_variables: false
