{% extends "suivi/base.html" %}
{% block titre %}Paramètres du carnet{% endblock %}
{% block contenu %}
<p class="fil"><a href="{% url 'gestion' %}">Gérer l'école</a></p>
<h1>Paramètres habituels du carnet</h1>
<p class="sous-titre">Ces choix servent de valeurs par défaut. Ils pourront être adaptés lors de chaque édition.</p>
<form method="post" class="encadre">
  {% csrf_token %}
  <label for="titre_couverture">Titre de couverture</label>
  <input id="titre_couverture" name="titre_couverture" value="{{ parametres.titre_couverture }}" maxlength="200">
  <label for="texte_couverture">Texte facultatif de couverture</label>
  <textarea id="texte_couverture" name="texte_couverture" maxlength="400">{{ parametres.texte_couverture }}</textarea>
  <label for="contenu_par_defaut">Contenu familial par défaut</label>
  <select id="contenu_par_defaut" name="contenu_par_defaut">
    <option value="reussites" {% if parametres.contenu_par_defaut == 'reussites' %}selected{% endif %}>Réussites</option>
    <option value="observes" {% if parametres.contenu_par_defaut == 'observes' %}selected{% endif %}>Réussites et apprentissages en cours</option>
    <option value="tout" {% if parametres.contenu_par_defaut == 'tout' %}selected{% endif %}>Référentiel complet</option>
  </select>
  <label for="regroupement_par_defaut">Regroupement temporel</label>
  <select id="regroupement_par_defaut" name="regroupement_par_defaut">
    <option value="aucun" {% if parametres.regroupement_par_defaut == 'aucun' %}selected{% endif %}>Aucun</option>
    <option value="annuel" {% if parametres.regroupement_par_defaut == 'annuel' %}selected{% endif %}>Annuel</option>
    <option value="mensuel" {% if parametres.regroupement_par_defaut == 'mensuel' %}selected{% endif %}>Mensuel</option>
    <option value="bilan" {% if parametres.regroupement_par_defaut == 'bilan' %}selected{% endif %}>Par bilan</option>
  </select>
  <label for="colonnes_par_defaut">Mise en page</label>
  <select id="colonnes_par_defaut" name="colonnes_par_defaut">
    <option value="1" {% if parametres.colonnes_par_defaut == 1 %}selected{% endif %}>Une colonne</option>
    <option value="2" {% if parametres.colonnes_par_defaut == 2 %}selected{% endif %}>Deux colonnes</option>
  </select>
  <p><label class="choix-simple"><input type="checkbox" name="afficher_attendus" {% if parametres.afficher_attendus %}checked{% endif %}> Afficher habituellement les attendus</label></p>
  <p><label class="choix-simple"><input type="checkbox" name="afficher_sous_domaines" {% if parametres.afficher_sous_domaines %}checked{% endif %}> Afficher habituellement les sous-domaines</label></p>
  <p><label class="choix-simple"><input type="checkbox" name="inclure_bilans" {% if parametres.inclure_bilans %}checked{% endif %}> Inclure habituellement les bilans</label></p>
  <div class="actions"><button class="bouton" type="submit">Enregistrer les paramètres</button></div>
</form>
{% endblock %}
