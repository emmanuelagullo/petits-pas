<form method="post" class="formulaire-contextuel" data-formulaire-modifie>
  {% csrf_token %}
  <input type="hidden" name="action" value="affecter">
  <input type="hidden" name="vue" value="{{ vue }}">
  {% if afficher_historique %}<input type="hidden" name="historique" value="1">{% endif %}
  {% if vue == "classes" %}
    <input type="hidden" name="classe" value="{{ classe.pk }}">
    <label>Personne <select name="appartenance" required>
      <option value="">Choisir une personne</option>
      {% for membre in membres_affectables %}<option value="{{ membre.pk }}">{{ membre.utilisateur.get_full_name|default:membre.utilisateur.username }}</option>{% endfor %}
    </select></label>
  {% else %}
    <input type="hidden" name="appartenance" value="{{ appartenance.pk }}">
    <label>Classe <select name="classe" required>
      <option value="">Choisir une classe</option>
      {% for destination in classes_affectables %}<option value="{{ destination.pk }}">{{ destination.libelle_avec_annee }}</option>{% endfor %}
    </select></label>
  {% endif %}
  <label>Fonction <select name="type">
    {% for valeur, libelle in types_affectation %}<option value="{{ valeur }}"{% if vue == "classes" and classe.anomalie_ouverte and valeur == "responsable" %} selected{% endif %}>{{ libelle }}</option>{% endfor %}
  </select></label>
  <label>Fin éventuelle <input type="date" name="date_fin"></label>
  <label>Motif <input name="motif"></label>
  <div class="actions">
    <button class="bouton" type="submit" data-enregistrer>Attribuer</button>
    {% include "suivi/partiels/annuler_modifications.html" %}
  </div>
</form>
