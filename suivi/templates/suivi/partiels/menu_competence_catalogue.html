    {% if ligne.modifier %}<a class="bouton discret" href="{{ ligne.modifier }}">Modifier</a>{% endif %}
    {% if ligne.visibilite %}
    <form method="post" action="{{ url_resultats }}">
      {% csrf_token %}
      <input type="hidden" name="action" value="visibilite_catalogue">
      <input type="hidden" name="competence" value="{{ ligne.competence.pk }}">
      <input type="hidden" name="adoption" value="{{ adoption.pk }}">
      <input type="hidden" name="revision" value="{{ ligne.revision_gestion }}">
      <button class="bouton discret" name="visibilite" value="{{ ligne.visibilite }}">{% if ligne.visibilite == "masquer" %}Masquer{% else %}Réafficher{% endif %}</button>
    </form>
    {% endif %}
{% if ligne.deplacement or ligne.modifier_suivi %}
<details class="menu-competence-catalogue">
  <summary class="bouton bouton-depliant discret" aria-label="Autres actions pour {{ ligne.competence.libelle }}">⋯</summary>
  <div class="actions">
    {% if ligne.deplacement %}<a class="bouton discret" href="{{ ligne.deplacement }}">Déplacer…</a>{% endif %}
    {% if ligne.modifier_suivi %}<a class="bouton discret" href="{{ ligne.modifier_suivi }}">Modifier les élèves suivis</a>{% endif %}
  </div>
</details>
{% endif %}
