<details class="details-filtres-catalogue" data-panneau-filtre data-options-carnet{% if panneau_ouvert == 'mise-en-page' or mise_en_page_ouverte == 'carnet' %} open{% endif %}>
  <summary class="bouton discret">Mise en page</summary>
  <div class="groupes-filtres">
    <fieldset class="groupe-filtres">
      <legend>Colonnes</legend>
      <div class="choix-segmentes">
        <label><input type="radio" name="colonnes" value="1"{% if presentation.colonnes == '1' %} checked{% endif %}> Une colonne</label>
        <label><input type="radio" name="colonnes" value="2"{% if presentation.colonnes == '2' %} checked{% endif %}> Deux colonnes</label>
      </div>
    </fieldset>
    <fieldset class="groupe-filtres">
      <legend>Regrouper les acquisitions</legend>
      <div class="choix-segmentes">
        <label><input type="radio" name="regroupement" value="aucun"{% if presentation.regroupement == 'aucun' %} checked{% endif %}> Aucun</label>
        <label><input type="radio" name="regroupement" value="annuel"{% if presentation.regroupement == 'annuel' %} checked{% endif %}> Annuel</label>
        <label><input type="radio" name="regroupement" value="mensuel"{% if presentation.regroupement == 'mensuel' %} checked{% endif %}> Mensuel</label>
        <label><input type="radio" name="regroupement" value="bilan"{% if presentation.regroupement == 'bilan' %} checked{% endif %}> Par bilan</label>
      </div>
      <label class="choix"><input type="checkbox" name="sous_domaines"{% if presentation.sous_domaines == '1' %} checked{% endif %}> Afficher les sous-rubriques</label>
    </fieldset>
  </div>
  {% if apercu_individuel %}<button class="bouton" name="panneau" value="mise-en-page">Actualiser l’aperçu</button>{% endif %}
</details>
