{% comment %}Une ligne « enfant » dans la saisie éclair d'une compétence.{% endcomment %}
<div class="ligne" id="e{{ eleve.pk }}">
  <form hx-post="{% url 'basculer' eleve.pk competence.pk %}?vue=classe"
        hx-target="#e{{ eleve.pk }}" hx-swap="outerHTML">
    {% csrf_token %}
    <button class="bascule" type="submit"
            data-statut="{{ obs.statut|default:'' }}"
            aria-label="{{ eleve }} — {% if obs %}{{ obs.get_statut_display }}{% else %}pas encore observé{% endif %}">
      <span class="marqueur" aria-hidden="true">{% if obs.statut == 'reussi' %}✓{% elif obs.statut == 'en_cours' %}◐{% endif %}</span>
      <span class="libelle">{{ eleve.prenom }} {{ eleve.nom }}</span>
      <span class="pastille">{{ eleve.niveau }}</span>
    </button>
  </form>
  <a class="trace-lien {% if obs.a_un_commentaire or obs.a_une_photo %}pleine{% endif %}"
     href="{% url 'trace' eleve.pk competence.pk %}"
     aria-label="{% if obs.a_un_commentaire or obs.a_une_photo %}Consulter ou ajouter une trace{% else %}Ajouter un commentaire ou une photo{% endif %}"
     title="{% if obs.a_un_commentaire or obs.a_une_photo %}Consulter ou ajouter une trace{% else %}Ajouter un commentaire ou une photo{% endif %}">
    {% if obs.a_un_commentaire or obs.a_une_photo %}
    <span class="trace-indicateurs" aria-hidden="true">
      {% if obs.a_un_commentaire %}<span class="indicateur-commentaire">✎</span>{% endif %}
      {% if obs.a_une_photo %}<span class="indicateur-photo">📷</span>{% endif %}
    </span>
    {% else %}+{% endif %}
  </a>
</div>
