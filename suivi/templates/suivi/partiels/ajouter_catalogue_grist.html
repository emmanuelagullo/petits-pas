<form method="post" action="{{ retour }}">{% csrf_token %}
<label for="url-catalogue">Lien du catalogue Grist</label>
<input type="url" id="url-catalogue" name="url" required maxlength="2000" value="{{ url_saisie }}"{% if erreur_lien %} aria-invalid="true" aria-describedby="erreur-lien-catalogue"{% endif %}>
<p><label><input type="checkbox" name="suivre_catalogue" value="oui"{% if suivi_initial %} checked{% endif %}> Suivre les nouveautés de ce catalogue {% if gestion_classe %}pour la classe{% else %}pour l’école{% endif %}</label></p>
<button class="bouton" name="action" value="ajouter">Ajouter le catalogue</button>
</form>
