{% extends "suivi/base.html" %}
{% block titre %}Entrer dans le carnet{% endblock %}
{% block contenu %}
<h1>Carnet de suivi des apprentissages</h1>
<p class="sous-titre">Connectez-vous avec votre compte Petits Pas.</p>
<form method="post" class="encadre">
  {% csrf_token %}
  <label for="nom_utilisateur">Nom d'utilisateur
    <span class="aide">Celui associé à votre compte Petits Pas.</span>
  </label>
  <input type="text" id="nom_utilisateur" name="nom_utilisateur" autocomplete="username" autofocus required>
  <label for="mdp">Mot de passe</label>
  <input type="password" id="mdp" name="mot_de_passe" autocomplete="current-password" required>
  <p class="aide"><a href="{% url 'mot_de_passe_oublie' %}">Mot de passe oublié ?</a></p>
  <div class="actions"><button class="bouton" type="submit">Entrer</button></div>
</form>
{% endblock %}
