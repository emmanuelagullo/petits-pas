{% extends "suivi/base.html" %}
{% block titre %}Une trace pour {{ eleve.prenom }}{% endblock %}
{% block contenu %}
<p class="fil"><a href="{% url 'saisie_eleve' eleve.pk %}">{{ eleve.prenom }} {{ eleve.nom }}</a></p>
<h1>{{ competence.libelle }}</h1>
<p class="sous-titre">{{ competence.domaine.nom }}</p>

<form method="post" enctype="multipart/form-data" class="encadre">
  {% csrf_token %}
  <label for="commentaire">Le mot qui accompagne la réussite
    <span class="aide">Ce que l'enfant a dit, ce que vous avez vu. C'est ce texte qui apparaîtra dans le carnet.</span>
  </label>
  <textarea id="commentaire" name="commentaire">{{ obs.commentaire }}</textarea>

  <label for="date_observation">Date</label>
  <input type="date" id="date_observation" name="date_observation" value="{{ obs.date_observation|date:'Y-m-d' }}">

  {% if obs.photo %}
  <label>Photo actuelle</label>
  <img class="miniature" src="{{ obs.photo.url }}" alt="">
  <p><label style="font-weight:400"><input type="checkbox" name="retirer_photo" style="width:auto;min-height:0"> Retirer cette photo</label></p>
  {% endif %}

  <label for="photo">{% if obs.photo %}Remplacer par une autre photo{% else %}Ajouter une photo{% endif %}
    <span class="aide">Une photo du travail, pas du visage de l'enfant, si vous voulez rester tranquille côté RGPD.</span>
  </label>
  <input type="file" id="photo" name="photo" accept="image/*">

  <div class="actions">
    <button class="bouton" type="submit">Enregistrer la trace</button>
    <a class="bouton discret" href="{% url 'saisie_eleve' eleve.pk %}">Annuler</a>
  </div>
</form>
{% endblock %}
