{{ $mode := .Get "mode" }}
{{ $icone := "▣" }}{{ if eq $mode "service" }}{{ $icone = "↔" }}{{ end }}
<section class="parcours parcours-{{ $mode }}">
  <h2><span aria-hidden="true">{{ $icone }}</span> {{ .Get "titre" }}</h2>
  {{ .Inner | .Page.RenderString }}
  {{ if eq (.Get "demonstration") "oui" }}
  <p class="actions"><a class="button primary" href="{{ .Site.Data.demonstration.url }}" rel="external">Ouvrir la démonstration en ligne</a></p>
  {{ end }}
</section>
