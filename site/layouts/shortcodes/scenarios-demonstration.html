{{- $demo := .Site.Data.demonstration -}}
{{- $ids := slice -}}
{{- with .Get "ids" -}}
  {{- $ids = split . "," -}}
{{- end -}}
<div class="screenshot-gallery role-scenarios{{ if eq (len $ids) 1 }} single{{ end }}">
  {{- range $demo.scenarios }}
  {{- if or (eq (len $ids) 0) (in $ids .id) }}
  <figure id="scenario-{{ .id }}">
    <a class="screenshot-link" href="{{ printf "captures/%s" .capture | relURL }}" target="_blank" rel="noopener">
      <picture>
        {{- with .capture_mobile }}
        <source media="(max-width: 600px)" srcset="{{ printf "captures/%s" . | relURL }}">
        {{- end }}
        <img src="{{ printf "captures/%s" .capture | relURL }}" alt="{{ .titre }} dans la démonstration fictive de Petits Pas" loading="lazy">
      </picture>
      <span class="visually-hidden">Ouvrir l'image en grand dans un nouvel onglet</span>
    </a>
    <figcaption><b>{{ .titre }}</b><br>{{ .legende }}</figcaption>
  </figure>
  {{- end }}
  {{- end }}
</div>
