{{ define "main" }}
  <article class="page shell prose">
    <p class="eyebrow">Petits Pas</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    {{ .Content }}
    {{ if ne .Params.showChildren false }}
      {{ range .Pages }}
        <p><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }} — {{ . }}{{ end }}</p>
      {{ end }}
    {{ end }}
  </article>
{{ end }}
