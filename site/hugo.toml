  pageRef = "/demonstration/"
  weight = 2

[[menus.main]]
  name = "Guide pratique"
  pageRef = "/guide/"
  weight = 3

[[menus.main]]
  name = "Le projet"
  pageRef = "/projet/"
  weight = 4

[[menus.main]]
  name = "Contribuer"
  pageRef = "/contribuer/"
  weight = 5

[[menus.footer]]
