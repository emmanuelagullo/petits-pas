theme = "pas"
themesDir = "theme-communs/hugo"
baseURL = "/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"
title = "Petits Pas"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  themeColor = "#285242"
  projectPath = "projet/"
  description = "Un carnet numérique libre pour suivre les apprentissages en maternelle."
  repository = "https://gitlab.inria.fr/petits-pas/petits-pas"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[security]
  allowContent = ["^text/markdown$", "^text/org$"]
  enableInlineShortcodes = false

[[menus.main]]
  name = "Démarrer"
  pageRef = "/demarrer/"
  weight = 1

[[menus.main]]
